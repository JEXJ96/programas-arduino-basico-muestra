<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<title>Programas básicos de Arduino</title>
<style>
:root{
  --bg:#0b0e14; --panel:#12151c; --panel-2:#161a22;
  --line:#1e222b; --line-2:#262b36;
  --ink:#e6edf3; --muted:#7d8590;
  --accent:#00e5ff; --sobre-accent:#04141a;
  --wa:#25D366;
  --verde:#47e0a0; --verde-fondo:#47e0a01a; --verde-borde:#47e0a04d;
  --punto:#ffffff26;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --sans:"Avenir Next","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel-2:#eceff3;
    --line:#dfe3e9; --line-2:#cfd5dd;
    --ink:#0d1117; --muted:#57606a;
    --accent:#007d94; --sobre-accent:#ffffff;
    --verde:#0a7a4f; --verde-fondo:#0a7a4f14; --verde-borde:#0a7a4f55;
    --punto:#0d111726;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e14; --panel:#12151c; --panel-2:#161a22;
  --line:#1e222b; --line-2:#262b36;
  --ink:#e6edf3; --muted:#7d8590;
  --verde:#47e0a0; --verde-fondo:#47e0a01a; --verde-borde:#47e0a04d;
  --punto:#ffffff26;
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#eceff3;
  --line:#dfe3e9; --line-2:#cfd5dd;
  --ink:#0d1117; --muted:#57606a;
  --verde:#0a7a4f; --verde-fondo:#0a7a4f14; --verde-borde:#0a7a4f55;
  --punto:#0d111726;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

.intro{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:flex-start;justify-content:center;
  padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b));
  background:var(--bg);
  background-image:
    radial-gradient(circle at 50% 0%, #00e5ff1a, transparent 55%),
    radial-gradient(circle at 50% 100%, #00e5ff0a, transparent 60%);
  overflow-y:auto;
  transition:opacity .38s ease, visibility .38s ease;
}
@media (prefers-color-scheme: light){
  .intro{background-image:
    radial-gradient(circle at 50% 0%, #007d9414, transparent 55%),
    radial-gradient(circle at 50% 100%, #007d940a, transparent 60%);}
}
.intro.oculto{opacity:0;visibility:hidden;pointer-events:none}
.intro-caja{
  width:100%;max-width:460px;margin:auto 0;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:14px;padding:6px 0;
}
.intro-logo{
  display:flex;align-items:center;justify-content:center;
  margin-bottom:2px;
}
.logo-vacio{
  width:220px;height:165px;
  border:2px dashed var(--line-2);border-radius:16px;
  display:grid;place-items:center;gap:6px;
  color:var(--muted);transition:all .2s;padding:14px;
}
.logo-vacio svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.logo-vacio span{font-size:.78rem;font-weight:650;letter-spacing:.02em}
.intro-logo.editable:hover .logo-vacio{border-color:var(--accent);color:var(--accent);background:#00e5ff0a}
.logo-silueta{
  display:block;height:var(--logo-h,220px);
  aspect-ratio:var(--logo-aspect,1);
  background-image:var(--logo-url);background-position:center;
  background-size:contain;background-repeat:no-repeat;
  transition:height .22s ease;
}
.logo-silueta.recolor,.marca .icono-cabecera.recolor{
  background-image:none;
  background-color:var(--logo-color, var(--accent));
  -webkit-mask:center / contain no-repeat;
  mask:center / contain no-repeat;
  -webkit-mask-image:var(--logo-url);
  mask-image:var(--logo-url);
  filter:drop-shadow(0 0 22px var(--logo-color, var(--accent)));
}
.marca .icono-cabecera.recolor{filter:drop-shadow(0 0 8px var(--logo-color, var(--accent)))}
.logo-silueta[hidden],.logo-vacio[hidden]{display:none}
.folio-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line-2);
  color:var(--muted);font-size:.74rem;font-weight:600;letter-spacing:.03em;
}
.folio-badge strong{
  color:var(--accent);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.88rem;font-weight:800;letter-spacing:.06em;
}
.folio-badge[hidden]{display:none}
.intro-controles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.ctrl-grupo{
  display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--panel-2);
  font-size:.8rem;color:var(--muted);
}
.ctrl-grupo button{
  width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;
  font-size:1.05rem;font-weight:700;color:var(--ink);
  transition:background .15s, color .15s;
}
.ctrl-grupo button:hover{background:var(--line-2);color:var(--accent)}
.ctrl-grupo button:active{background:var(--accent);color:var(--sobre-accent)}
.ctrl-grupo span{
  min-width:46px;text-align:center;
  font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink);font-size:.8rem;
}
.ctrl-color{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 8px 3px 3px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--panel-2);
  cursor:pointer;position:relative;
}
.ctrl-color input[type=color]{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.ctrl-color .swatch{
  width:26px;height:26px;border-radius:50%;
  background:var(--logo-color, var(--accent));
  border:1px solid var(--line);
  box-shadow:inset 0 0 0 1px #ffffff22;
  transition:background .2s ease;
}
.ctrl-color small{font-size:.74rem;font-weight:650;color:var(--muted);padding-right:6px}
.ctrl-color:hover .swatch{transform:scale(1.06)}
.ctrl-color:hover small{color:var(--accent)}
.ctrl-tema{display:inline-flex;align-items:center;gap:1px;padding:3px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--panel-2)}
.ctrl-tema button{height:28px;padding:0 11px;border-radius:999px;font-size:.78rem;font-weight:650;
  color:var(--muted);transition:background .15s,color .15s}
.ctrl-tema button[aria-pressed="true"]{background:var(--accent);color:var(--sobre-accent)}
.ctrl-tema button:not([aria-pressed="true"]):hover{background:var(--line-2);color:var(--ink)}
.intro-info{display:flex;flex-direction:column;gap:9px;margin-top:2px;width:100%}
.intro-badge{
  display:inline-flex;align-self:center;
  padding:4px 12px;border-radius:999px;
  background:#00e5ff14;border:1px solid #00e5ff55;
  color:var(--accent);font-size:.72rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  min-height:1.7em;opacity:0;transform:translateY(4px);
  transition:opacity .35s ease, transform .35s ease;
}
.intro-badge.visible{opacity:1;transform:none}
.intro-info h2{
  font-size:1.12rem;font-weight:700;letter-spacing:-.01em;
  line-height:1.35;color:var(--ink);min-height:2.7em;
}
.badge-mini{
  display:inline-block;padding:1px 7px;border-radius:5px;
  font-size:.82rem;color:var(--accent);
  background:#00e5ff14;border:1px solid #00e5ff55;
  vertical-align:middle;margin-left:4px;
  opacity:0;transform:translateX(-4px);
  transition:opacity .3s ease, transform .3s ease;
}
.badge-mini.visible{opacity:1;transform:none}
.intro-info p{
  color:var(--muted);font-size:.93rem;line-height:1.55;
  max-width:40ch;margin:0 auto;min-height:3.2em;
}
.intro-info p.sub{font-size:.86rem;min-height:2.4em}
.intro-info p b{color:var(--ink);font-weight:650}
.typing::after{
  content:'|';color:var(--accent);font-weight:400;margin-left:1px;
  animation:blink .7s step-end infinite;
}
@keyframes blink{50%{opacity:0}}
.intro-acciones{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  width:100%;max-width:360px;margin-top:12px;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .45s ease, transform .45s ease;
}
.intro-acciones.visible{opacity:1;transform:none;pointer-events:auto}
.intro-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:52px;padding:0 32px;width:100%;max-width:320px;
  border-radius:999px;background:var(--accent);color:var(--sobre-accent);
  font-size:1rem;font-weight:700;letter-spacing:-.005em;
  box-shadow:0 10px 26px #00e5ff33;
  transition:transform .15s ease, box-shadow .25s ease;
}
.intro-btn:hover{transform:translateY(-1px);box-shadow:0 0 0 4px #00e5ff22, 0 12px 30px #00e5ff44}
.intro-btn:active{transform:translateY(0);box-shadow:0 0 0 2px #00e5ff33, 0 6px 18px #00e5ff33}
.intro-btn svg{width:16px;height:16px}
.admin-panel{
  width:100%;max-width:400px;margin-top:18px;padding:16px;border-radius:16px;
  border:1px dashed var(--line-2);background:var(--panel);
  display:flex;flex-direction:column;gap:11px;text-align:left;
}
.admin-titulo{
  display:flex;align-items:center;gap:8px;
  font-size:.72rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;
}
.admin-titulo::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 8px var(--accent);
}
.admin-panel label{display:flex;flex-direction:column;gap:5px}
.admin-panel label span{
  font-size:.72rem;font-weight:650;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;
}
.admin-panel input{
  height:38px;padding:0 12px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line-2);
  color:var(--ink);font:inherit;font-size:.88rem;
  -webkit-user-select:text;user-select:text;
}
.admin-panel input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #00e5ff1a}
.folio-linea{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 12px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line-2);
  font-size:.82rem;color:var(--muted);
}
.folio-linea strong{
  color:var(--accent);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.95rem;font-weight:800;letter-spacing:.06em;
}
.btn-export{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 18px;border-radius:999px;
  background:var(--accent);color:var(--sobre-accent);
  font-size:.88rem;font-weight:700;cursor:pointer;
  transition:transform .15s ease, box-shadow .2s ease;
  margin-top:2px;width:100%;
}
.btn-export:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 0 4px #00e5ff22}
.btn-export:disabled{opacity:.35;cursor:not-allowed}
.btn-export svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.admin-panel small{font-size:.7rem;color:var(--muted);line-height:1.4;text-align:center}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%, 20px);
  padding:12px 20px;border-radius:12px;
  background:var(--panel);color:var(--ink);
  border:1px solid var(--line-2);box-shadow:0 8px 24px #00000040;
  font-size:.88rem;font-weight:600;z-index:200;
  opacity:0;transition:opacity .2s ease, transform .2s ease;
  pointer-events:none;max-width:80vw;text-align:center;
}
.toast.visible{opacity:1;transform:translate(-50%, 0)}
@media (max-height:700px){
  .intro-caja{gap:10px}
  .intro-info h2{font-size:1.02rem;min-height:2.5em}
  .intro-info p{font-size:.87rem}
  .intro-btn{height:48px}
  .logo-vacio{width:180px;height:135px}
}

.app{height:100vh;height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column}
.cabecera{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:calc(14px + var(--safe-t)) 20px 4px}
.marca{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.marca .icono-cabecera{
  display:block;height:30px;aspect-ratio:var(--logo-aspect,1);
  background-image:var(--logo-url);background-position:center;
  background-size:contain;background-repeat:no-repeat;
  filter:drop-shadow(0 0 6px var(--logo-color, var(--accent)));
}
.btn-inicio{
  margin-left:auto;flex-shrink:0;width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;border:1px solid var(--line-2);background:var(--panel-2);
  transition:border-color .15s;
}
.btn-inicio:hover{border-color:var(--accent)}
.btn-inicio svg{width:16px;height:16px;fill:var(--ink)}
.chk-recolor{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 4px;
  border-radius:999px;border:1px solid var(--line-2);background:var(--panel-2);
  font-size:.78rem;font-weight:650;color:var(--muted);cursor:pointer;user-select:none}
.chk-recolor input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.chk-recolor:has(input:checked){color:var(--ink)}
.cabecera h1{
  font-size:1rem;font-weight:650;letter-spacing:-.005em;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.cabecera h1 .badge{
  display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;
  font-size:.86rem;font-weight:750;letter-spacing:.01em;
  color:var(--accent);background:#00e5ff14;border:1px solid #00e5ff55;
  box-shadow:0 0 0 1px #00e5ff1a inset, 0 0 10px #00e5ff22;
}
.pista{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pista::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;min-height:0;scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;flex-direction:column;gap:12px;padding:10px 20px 8px}
.texto h2{font-size:1.5rem;line-height:1.08;font-weight:760;letter-spacing:-.022em}
.texto p{margin-top:6px;color:var(--muted);font-size:.94rem;line-height:1.45;max-width:36ch}
.escena{--panel:#12151c;--line:#1e222b;--line-2:#262b36;--ink:#e6edf3;--muted:#7d8590;--accent:#00e5ff;
  --tope:22vh;flex:1;min-height:0;position:relative;border-radius:24px;border:1px solid var(--line);
  background:radial-gradient(circle at 1px 1px,#ffffff12 1px,transparent 1.5px) 0 0/20px 20px,var(--panel);
  display:flex;flex-direction:column;flex-wrap:nowrap;align-items:center;justify-content:center;
  gap:18px;padding:16px;overflow:hidden}
.escena.solo{--tope:30vh}
@media (orientation:landscape){
  .escena{flex-direction:row;flex-wrap:wrap;--tope:36vh;gap:22px 34px}
  .escena.solo{--tope:40vh}
}
.comp{display:flex;flex-direction:column;align-items:center;gap:10px}
.comp .visual{display:block;line-height:0;position:relative}
.comp .visual img{width:min(var(--tam,116px),var(--tope));height:auto;display:block}
.comp .etq{font-size:.86rem;color:var(--muted)}
.comp[data-tipo="boton"],.comp[data-tipo="pir"]{cursor:pointer;touch-action:pan-x;border-radius:20px;padding:6px 10px}
.comp[data-tipo="lcd"] .visual img{width:min(var(--tam,300px),calc(100vw - 88px))}
.escena.rejilla{flex-direction:row;flex-wrap:wrap;align-content:center;gap:18px 14px}
.escena.rejilla .comp[data-tipo="boton"]{flex:0 0 100%}
@media (orientation:landscape){
  .escena.rejilla{--tope:44px;gap:12px 14px}
  .escena.rejilla .comp[data-tipo="boton"]{flex:0 0 auto}
  .escena.rejilla .comp[data-tipo="boton"] .visual img{width:56px}
}
.comp[data-tipo="slider"]{flex-shrink:0}
.escena.combo{flex-direction:row;flex-wrap:wrap;align-content:center;gap:14px 26px}
.escena.combo .comp[data-tipo="slider"]{flex:0 0 100%}
.lcd-wrap{position:relative;width:min(var(--tam,300px),calc(100vw - 88px));display:inline-block;line-height:0}
.lcd-wrap img{display:block;width:100%;height:auto}
.lcd-txt{position:absolute;top:16%;left:8%;width:84%;height:68%;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;
  color:#00e5ff;text-shadow:0 0 6px #00e5ff88;display:flex;flex-direction:column;
  justify-content:space-around;font-size:clamp(11px,3.6vw,16px);letter-spacing:2px;line-height:1.3}
.lcd-txt span{white-space:pre}
.control{width:min(210px,100%)}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;
  background:transparent;cursor:pointer;touch-action:none;--pct:0%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;
  background:linear-gradient(90deg,var(--accent) var(--pct),var(--line-2) var(--pct))}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;
  border-radius:50%;border:0;background:var(--accent);box-shadow:0 0 0 5px #00e5ff26,0 0 14px #00e5ff88}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;border:0;
  background:var(--accent);box-shadow:0 0 0 5px #00e5ff26,0 0 14px #00e5ff88}
.tienda{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.tienda .producto{flex:1 0 100%}
.tienda .precio{flex:none;height:32px;padding:0 10px}
.tienda .btn{flex:1 1 118px;min-width:0;height:40px;padding:0 10px;gap:6px;font-size:.86rem;white-space:nowrap}
.tienda .btn.wa svg{width:16px;height:16px}
.producto{font-size:.95rem;font-weight:650;letter-spacing:-.005em}
.precio{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:99px;
  font-size:.86rem;font-weight:650;font-variant-numeric:tabular-nums;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink)}
.precio.gratis{color:var(--verde);border-color:var(--verde-borde);background:var(--verde-fondo)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;
  border-radius:99px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);
  font-size:.92rem;font-weight:600;text-decoration:none;transition:border-color .15s, background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primario{background:var(--accent);border-color:var(--accent);color:var(--sobre-accent)}
.btn svg{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.btn.wa{background:#25D366;border-color:#25D366;color:#ffffff;box-shadow:0 4px 12px #25D36633}
.btn.wa:hover{background:#1ebe5a;border-color:#1ebe5a}
.btn.wa svg{width:18px;height:18px;fill:currentColor;stroke:none}
.hoja{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja[hidden]{display:none}
.hoja-fondo{position:absolute;inset:0;background:#05070bcc;animation:aparecer .18s ease-out}
.hoja-panel{position:relative;width:100%;max-width:760px;max-height:86vh;max-height:86dvh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding-bottom:var(--safe-b);animation:subir .22s cubic-bezier(.2,.8,.2,1)}
@keyframes aparecer{from{opacity:0}}
@keyframes subir{from{opacity:0;transform:translateY(24px)}}
.hoja-cab{display:flex;align-items:center;gap:12px;padding:16px 16px 14px 20px;border-bottom:1px solid var(--line)}
.hoja-cab > div{flex:1;min-width:0}
.hoja-cab h3{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hoja-cab small{display:block;margin-top:3px;color:var(--muted);font-size:.84rem}
.cerrar{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:1px solid var(--line-2);background:var(--panel-2);
  display:grid;place-items:center;transition:border-color .15s}
.cerrar:hover{border-color:var(--accent)}
.cerrar svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.codigo{--ink:#e6edf3;--muted:#7d8590;flex:1;min-height:0;margin:0;padding:16px 20px;overflow:auto;background:#0d1017;color:var(--ink);
  font:.88rem/1.7 ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  white-space:pre;tab-size:2;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;outline-offset:-3px}
.codigo .c{color:var(--muted)}
.codigo .k{color:#00e5ff}
.codigo .n{color:#ffc857}
.codigo .s{color:#47e0a0}
.codigo .f{color:#c9a6ff}
.hoja-pie{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:520px){.hoja-pie .btn{flex:1}}
@media (max-height:520px){.hoja-panel{max-height:94vh;max-height:94dvh;border-radius:16px 16px 0 0}}
.pie{display:flex;align-items:center;justify-content:center;gap:14px;flex-shrink:0;
  padding:6px 20px calc(14px + var(--safe-b))}
.pausa{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel-2);
  display:grid;place-items:center;transition:border-color .15s;flex-shrink:0}
.pausa:hover{border-color:var(--accent)}
.pausa svg{width:16px;height:16px;fill:var(--ink)}
.puntos{display:flex;align-items:center}
.punto{height:40px;padding:16px 4px}
.punto i{display:block;height:8px;width:8px;border-radius:99px;background:var(--punto);transition:width .25s ease}
.punto[aria-current="true"] i{width:36px;
  background:linear-gradient(90deg,var(--accent) calc(var(--p,0) * 100%),var(--punto) 0)}
@media (max-height:520px){
  .slide{flex-direction:row;align-items:stretch;gap:18px}
  .texto{flex:0 0 36%}
  .texto h2{font-size:1.3rem}
}
img,.logo-silueta,.comp .visual{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none}
.comp .visual img,.lcd-wrap img{pointer-events:none}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

}

function contrasteAccesible(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.6 ? '#0d1117' : '#ffffff';
}
function aplicarTema(){
  const raiz = document.documentElement;
  raiz.style.setProperty('--accent', temaColor);
  raiz.style.setProperty('--sobre-accent', contrasteAccesible(temaColor));
  raiz.dataset.theme = (temaModo === 'auto') ? '' : temaModo;
  if(temaColorSwatch) temaColorSwatch.style.background = temaColor;
  if(!CONFIG.modoLectura){
    [[btnTemaAuto,'auto'],[btnTemaOscuro,'dark'],[btnTemaClaro,'light']].forEach(([b,v]) => {
      if(b) b.setAttribute('aria-pressed', String(v === temaModo));
    });
  }
}

/* =====================================================================
   FOLIO
   ===================================================================== */
function generarFolio(nombre, numero){
  if(!nombre) return '';
  const iniciales = nombre.trim().split(/\s+/)
    .map(w => w[0])
    .filter(c => c && /[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(c))
    .join('').toUpperCase().slice(0, 3);
  if(!iniciales) return '';
  const n = Math.max(1, Math.min(999, parseInt(numero, 10) || 1));
  return iniciales + String(n).padStart(3, '0');
}

function actualizarFolio(){
  if(!inputDistribuidor || !inputCatalogo) return;
  const folio = generarFolio(inputDistribuidor.value, inputCatalogo.value);
  CONFIG.folio = folio;
  if(folioPreview) folioPreview.textContent = folio || '—';
  if(folioBadge){
    folioBadge.hidden = !folio;
    if(folio) folioTexto.textContent = folio;
  }
}

if(!CONFIG.modoLectura && inputDistribuidor && inputCatalogo){
  inputDistribuidor.addEventListener('input', actualizarFolio);
  inputCatalogo.addEventListener('input', actualizarFolio);
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function typeInto(el, text, speed){
  if(!el) return;
  speed = speed || 25;
  el.textContent = '';
  el.classList.add('typing');
  for(let i = 0; i < text.length; i++){
    el.textContent += text[i];
    await sleep(speed);
  }
  el.classList.remove('typing');
}

   SONIDO
   ===================================================================== */
let audioCtx = null, oscActual = null;
function asegurarAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_) {}
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}
['pointerdown','keydown','touchend'].forEach(n =>
  document.addEventListener(n, asegurarAudio, { capture:true, passive:true }));

function sonar(freq){
  if(!audioCtx || audioCtx.state !== 'running') return;
  pararSonido();
  try {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = Math.max(20, Math.min(20000, freq));
    gain.gain.value = 0.05;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    oscActual = { osc, gain };
  } catch(_) {}
}
function pararSonido(){
  if(!oscActual) return;
  try {
    oscActual.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.015);
    oscActual.osc.stop(audioCtx.currentTime + 0.05);
  } catch(_) {}
  oscActual = null;
}

function crearInst(d){
  return {
    demo: d,
    els: {}, imgs: {}, anim: null, piezas: {},
    set(id, frame){
      const img = this.imgs[id];
      if(!img) return;
      const frames = this.piezas[id].frames;
      const src = (frames && typeof frames === 'object' && !Array.isArray(frames))
        ? frames[frame]
        : Array.isArray(frames) ? frames[frame] : frames;
      if(src && img.src !== src) img.src = src;
    },
    el(id){ return this.els[id]; },
    slider(id){ return this.els[id]; },
    texto(id){
      const t = document.createElement('div');
      t.className = 'lcd-txt';

  };

function reanudar(inst){
  if(!inst) return;
  detener(inst);
  Object.keys(inst.els).forEach(id => {
    const el = inst.els[id];
    if(el && el.dataset && (el.dataset.tipo === 'boton' || el.dataset.tipo === 'pir')){
      const clon = el.cloneNode(true);
      el.parentNode.replaceChild(clon, el);
      inst.els[id] = clon;
      const img = clon.querySelector('img');
      if(img) inst.imgs[id] = img;
    }
  });
  try { inst.demo.visor(inst); } catch(e){ console.error('Visor', inst.demo.id, e); }
}

function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const PALABRAS = new Set(['const','int','long','float','double','bool','boolean','void','byte','char','unsigned',
  'if','else','for','while','do','return','break','continue','new','static','String','Servo','include']);
const CONSTANTES = new Set(['HIGH','LOW','INPUT','OUTPUT','INPUT_PULLUP','true','false','LED_BUILTIN']);
const RE_CODIGO = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*")|(#include[^\n]*)|\b(0x[0-9A-Fa-f]+|\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;
function resaltar(codigo){
  let salida = '', desde = 0, m;
  RE_CODIGO.lastIndex = 0;
  while((m = RE_CODIGO.exec(codigo))){
    const tok = m[0];
    salida += esc(codigo.slice(desde, m.index));
    let cls = '';
    if(m[1]) cls = 'c';
    else if(m[2]) cls = 's';
    else if(m[3]) cls = 'k';
    else if(m[4]) cls = 'n';
    else if(PALABRAS.has(tok)) cls = 'k';
    else if(CONSTANTES.has(tok) || /^A[0-7]$/.test(tok)) cls = 'n';
    else if(/^[ \t]*\(/.test(codigo.slice(RE_CODIGO.lastIndex, RE_CODIGO.lastIndex + 8))) cls = 'f';
    salida += cls ? '<span class="' + cls + '">' + esc(tok) + '</span>' : esc(tok);
    desde = RE_CODIGO.lastIndex;
  }
  return salida + esc(codigo.slice(desde));
}

async function copiarCodigo(){
  if(!hojaDemo) return;
  const txt = hojaDemo.codigo;
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch(_) {}
  if(!ok){
    const t = document.createElement('textarea');
    t.value = txt; t.setAttribute('readonly',''); t.style.cssText = 'position:fixed;opacity:0';
    document.body.append(t); t.select();
    try { ok = document.execCommand('copy'); } catch(_) {}
    t.remove();
    hojaCopiar.focus({ preventScroll:true });
  }
  hojaCopiar.textContent = ok ? '¡Copiado!' : 'No se pudo copiar';
  clearTimeout(copiadoTimer);
  copiadoTimer = setTimeout(() => { hojaCopiar.textContent = 'Copiar código'; }, 1800);
}

async function exportarCatalogo(){
  if(CONFIG.modoLectura) return;

  const nombre = (inputDistribuidor.value || '').trim();
  const numero = parseInt(inputCatalogo.value, 10) || 1;

  if(!nombre){ alert('Escribe el nombre de quien autoriza la distribución.'); return; }
  if(!logoDataURL){ alert('Sube el logo antes de exportar.'); return; }

  const folio = generarFolio(nombre, numero);
  if(!folio){ alert('No se pudo generar el folio. Revisa el nombre.'); return; }

  let pristine = window.__PRISTINE_HTML__;
  if(!pristine || pristine.length < 500){
    alert('No se pudo preparar la plantilla. Recarga la página e intenta de nuevo.');
    return;
  }

  // 2) Quitar secciones admin-only
  pristine = pristine.replace(/<!--\s*admin-only:start\s*-->[\s\S]*?<!--\s*admin-only:end\s*-->/g, '');

  // 3) Preparar datos de exportación
  const exportData = {
    modoLectura: true,
    logoURL: logoDataURL,
    logoAspect: logoAspect,
    logoColor: logoColor,
    logoTam: logoTam,
    temaColor: temaColor,
    tema: temaModo,
    logoRecolor: logoRecolor,
    distribuidor: nombre,
    folio: folio,
    whatsapp: CONFIG.whatsapp,
    whatsappMensaje: CONFIG.whatsappMensaje
  };

  // Escape de </ para no romper el <script> al abrir el archivo
  const jsonTexto = JSON.stringify(exportData).replace(/<\//g, '<\\/');

  // 4) Inyectar CSS vars + JSON antes de </head>
  const styleInject =
    '<style data-export-inject>:root{' +
    '--logo-url:url("' + logoDataURL + '");' +
    '--logo-aspect:' + logoAspect + ';' +
    '--logo-color:' + logoColor + ';' +
    '}</style>';

  const jsonInject =
    '<script data-export-inject type="application/json" id="__export__">' +
    jsonTexto +
    '<\/script>';

  const cierre = pristine.indexOf('</head>');
  const html = pristine.slice(0, cierre) + styleInject + jsonInject + pristine.slice(cierre);

  // 5) Descargar
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'catalogo-' + folio + '.html';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);

  mostrarToast('✓ Catálogo exportado · Folio ' + folio);
}

/* Loop */
let ultimo = performance.now();
function tick(ahora){
  const dt = Math.min(100, ahora - ultimo);
  ultimo = ahora;
  if(!pausado && introCerrada){
    progreso += dt;
    if(progreso >= DURACION){ progreso = 0; irA(actual + 1); }
    const punto = puntosEl.children[actual];
    if(punto) punto.firstChild.style.setProperty('--p', progreso / DURACION);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
